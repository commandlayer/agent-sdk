[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commandlayer-agent-sdk"
version = "1.0.0"
description = "Python SDK for signing and verifying CommandLayer agent receipts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CommandLayer" }]

[project.optional-dependencies]
crypto = ["cryptography>=42.0"]
